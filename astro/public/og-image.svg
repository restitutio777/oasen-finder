<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- ============================================================
       OG-Image · werkSTATT Gemeinschaft
       Hell, freundlich, warm — im Stil des Live-Hero:
       Cream-Base + Bronze-Wärme-Wash von unten, klare Typo.
       ============================================================ -->

  <defs>
    <!-- Radial-Gradients: Bronze-Wash von unten Mitte (Haupt) +
         ein zarter Amber-Hauch unten rechts (Tiefe) -->
    <radialGradient id="warmGlow" cx="50%" cy="100%" r="85%">
      <stop offset="0%" stop-color="#c89a78" stop-opacity="0.34"/>
      <stop offset="70%" stop-color="#c89a78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHint" cx="85%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#d9a875" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#d9a875" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cream-Background -->
  <rect width="1200" height="630" fill="#fbf6f3"/>
  <!-- Warm-Wash von unten + Amber-Hauch -->
  <rect width="1200" height="630" fill="url(#warmGlow)"/>
  <rect width="1200" height="630" fill="url(#amberHint)"/>

  <!-- ============================================================
       LOGO + BRAND oben links
       ============================================================ -->
  <g transform="translate(80, 76)">
    <!-- Logo: W mit Swash + Punkt (aus werkstatt-logo.svg, scaled 100x83) -->
    <g transform="scale(0.85)">
      <text x="40" y="56" text-anchor="middle"
            font-family="Cormorant Garamond, Georgia, serif"
            font-weight="700" font-size="68" fill="#c89a78">W</text>
      <path d="M 64,18 C 84,8 108,18 110,40 C 110,62 92,82 60,84 C 32,86 14,76 12,60 C 12,52 18,46 26,48 C 32,49 34,54 30,56"
            stroke="#5497b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="30" cy="56" r="1.6" fill="#5497b8"/>
    </g>
    <!-- Wortmarke rechts neben dem Logo -->
    <g transform="translate(115, 12)">
      <text x="0" y="0" font-family="Cormorant Garamond, Georgia, serif"
            font-weight="700" font-size="40" letter-spacing="0.5" fill="#c89a78">WERKSTATT</text>
      <text x="0" y="34" font-family="Cormorant Garamond, Georgia, serif"
            font-weight="500" font-style="italic" font-size="32" fill="#5497b8">Gemeinschaft</text>
    </g>
  </g>

  <!-- ============================================================
       HAUPTBEREICH · Eyebrow + Headline + Subtitle
       Vertikal mittig, linksbündig
       ============================================================ -->

  <!-- Eyebrow (italic) -->
  <text x="80" y="320"
        font-family="Cormorant Garamond, Georgia, serif"
        font-style="italic" font-size="32"
        fill="#7a5947">GemeinschaftsWERK statt allein unterwegs</text>

  <!-- Headline · zweizeilig, „Gemeinschaft" in Türkis-Petrol italic -->
  <text x="80" y="410"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="86" font-weight="500"
        fill="#2d2435" letter-spacing="-1.5">Auf der Suche —</text>
  <text x="80" y="500"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="86" font-weight="500"
        fill="#2d2435" letter-spacing="-1.5">wie wird <tspan font-style="italic" font-weight="500" fill="#5497b8">Gemeinschaft?</tspan></text>

  <!-- Subtitle: Caps mit Punkten -->
  <text x="80" y="560"
        font-family="Inter, system-ui, sans-serif"
        font-size="18" letter-spacing="4"
        fill="#7a5947">REISEN  ·  WERKSTÄTTEN  ·  NOTIZEN  ·  FOTOS</text>

  <!-- URL unten rechts, dezent -->
  <text x="1120" y="590" text-anchor="end"
        font-family="Inter, system-ui, sans-serif"
        font-size="14" letter-spacing="1.5"
        fill="#a89684">werkstatt-gemeinschaft</text>
</svg>
